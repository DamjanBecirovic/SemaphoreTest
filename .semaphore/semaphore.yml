version: v1.0
name: "Test example"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2004
blocks:
  - name: "List changed files"
    dependencies: []
    task:
      jobs:
      - name: "Push outputs to SuperPlane"
        commands:
          - export CHANGED_SERVICES="app1,app3"
          - |
            curl -s \
              "https://app.superplane.com/api/v1/outputs" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $SEMAPHORE_OIDC_TOKEN" \
              --data "{\"execution_id\":\"$SUPERPLANE_STAGE_EXECUTION_ID\",\"external_id\":\"$SEMAPHORE_WORKFLOW_ID\",\"outputs\":{\"CHANGED_SERVICES\":\"$CHANGED_SERVICES\"}}"
